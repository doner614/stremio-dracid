name: Atualizar Catalogo Stremio

on:
  schedule:
    # Corre todos os dias às 12:45 UTC (13:45 em Portugal Continental)
    - cron: '45 12 * * *'
  workflow_dispatch: # Permite-lhe rodar o robô manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código do repositorio
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Executar o robo
      run: python bot.py

    - name: Guardar alteracoes na lista
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add manifest.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Lista atualizada automaticamente" && git push)
